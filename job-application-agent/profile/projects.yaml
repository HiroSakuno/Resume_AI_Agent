projects:
  - id: proj_001
    name: Resume AI Agent
    year: "2026"
    project_type: Personal AI Automation Project
    summary: >
      Built a local AI-assisted job application generator that uses structured
      YAML profile data, job descriptions, prompt templates, and Claude to
      generate tailored resumes, cover letters, ATS reports, and quality checks.
    tech_stack:
      - Python
      - Claude
      - YAML
      - Markdown
      - Prompt Engineering
      - AI Automation
      - DOCX Export
      - PDF Export
    highlights:
      - >
        Designed a multi-step application pipeline that parses job
        descriptions, selects relevant candidate evidence, generates tailored
        application materials, and saves structured outputs for review.
      - >
        Organized candidate profile data into reusable YAML files for
        experience, skills, achievements, certifications, education, and
        projects, keeping generated resumes grounded in verified information.
      - >
        Implemented reusable prompt and template files to support consistent,
        ATS-friendly resume and cover letter generation across different roles.

  - id: proj_002
    name: Natural Language SQL Agent
    year: "2025"
    project_type: AI Engineering Project (LLM + Agentic SQL Orchestration)
    summary: >
      Engineered an n8n-based LLM agent that converts natural language
      analytics questions into executable Supabase SQL queries using
      retrieval-augmented schema context, then returns accurate results in
      plain language.
    tech_stack:
      - SQL
      - n8n
      - Supabase
      - Vector Store (RAG)
      - API Integration
      - Prompt Engineering
      - LLM Agent Orchestration
    highlights:
      - >
        Designed a schema-aware NL-to-SQL pipeline that maps business questions
        to relevant tables, joins, and filters before query generation.
      - >
        Implemented RAG over table relationships, schema metadata, and business
        constraints to improve query correctness and reduce hallucinated SQL.
      - >
        Orchestrated end-to-end execution in n8n, including input handling,
        context retrieval, SQL generation, query execution, and response
        synthesis.
      - >
        Delivered non-technical, natural language answers so stakeholders can
        query production data without writing SQL.
