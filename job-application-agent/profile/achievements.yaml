achievements:
  - title: ~50% Power BI Capacity Reduction at Grupo NC
    situation: >
      Grupo NC had high Power BI Premium capacity consumption driven by large
      semantic models, complex DAX calculations, heavy reports, and high-volume
      datasets with 250M+ rows.
    task: >
      Improve report performance and reduce capacity pressure without removing
      critical business functionality used by stakeholders.
    action: >
      Analyzed capacity metrics and report usage patterns, optimized DAX
      measures, restructured semantic models, reduced unnecessary model
      complexity, pushed transformations down to SQL and Databricks, and
      implemented incremental refresh for high-volume datasets.
    result: >
      Reduced Power BI Premium capacity consumption by approximately 50%,
      improved report responsiveness, increased model maintainability, and
      helped stabilize the analytics environment for enterprise users.
    description: >
      Reduced Power BI Premium capacity consumption by approximately 50% at
      Grupo NC by identifying the heaviest reports, optimizing DAX measures,
      restructuring semantic models, applying SQL pushdown to Databricks, and
      enabling incremental refresh across high-volume datasets with 250M+ rows.
    impact: cost_reduction
    measurable: true

  - title: SAP ECC to S/4HANA Reporting Migration Support at AB InBev
    situation: >
      AB InBev's Canada and US teams were migrating SAP ECC reporting solutions
      to SAP S/4HANA as part of a global ERP transformation program.
    task: >
      Support report migration readiness by identifying Power BI dependencies,
      mapping SAP ECC source logic to S/4HANA-compatible structures, and
      validating data transformation rules across reporting solutions.
    action: >
      Used TMDL files, OpenAI Codex, Power BI metadata analysis, SAP table
      mapping, Databricks, Airflow, Python, and SQL validation routines to
      analyze report relationships, measures, tables, dependencies, and
      business logic required for migration.
    result: >
      Accelerated report discovery and migration analysis, improved visibility
      into source-to-report dependencies, reduced manual mapping effort, and
      supported more reliable SAP ECC to SAP S/4HANA reporting migration
      delivery.
    description: >
      Supported SAP ECC to SAP S/4HANA reporting migration at AB InBev by using
      TMDL, OpenAI Codex, Power BI metadata analysis, SAP table mapping,
      Databricks, Airflow, Python, and SQL validation routines to identify
      report dependencies, reconcile business logic, and improve migration
      readiness.
    impact: delivery
    measurable: true

  - title: Enterprise BI Solutions Delivery across Grupo NC, Sicredi, and Consulting Clients
    situation: >
      Multiple organizations needed scalable BI solutions to support executive
      reporting, operational analytics, financial visibility, social investment
      tracking, and client-facing reporting across different business domains.
    task: >
      Deliver end-to-end BI solutions that were reliable, secure, scalable, and
      easy for stakeholders to consume across enterprise and consulting
      environments.
    action: >
      Designed Power BI dashboards, semantic models, ETL flows, RLS security
      models, SQL queries, Oracle and PL/SQL routines, paginated reports, and
      standardized reporting templates for multiple clients and business areas.
    result: >
      Delivered analytics solutions used by business stakeholders across
      enterprise environments, supported reporting for 3,600 schools in Brazil,
      standardized Power BI delivery for 50+ accounting clients, and improved
      consistency, governance, and scalability of BI reporting.
    description: >
      Delivered end-to-end BI solutions across Grupo NC, Sicredi, and
      consulting clients by designing Power BI dashboards, semantic models, ETL
      flows, RLS security models, SQL routines, Oracle/PLSQL logic, and
      paginated reports, supporting enterprise stakeholders, 3,600 schools in
      Brazil, and 50+ accounting clients.
    impact: client_delivery
    measurable: true